{% extends 'base.html' %}

{% block title %}404 - Page Not Located | Isaac Rono{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-16 text-center space-y-6">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-brand-500/10 border border-brand-500/20 text-brand-400 font-mono text-3xl font-bold">
        404
    </div>
    
    <div class="space-y-2">
        <h1 class="text-3xl font-bold text-white tracking-tight">Endpoint Not Found</h1>
        <p class="text-gray-400 text-sm leading-relaxed max-w-md mx-auto">
            The resource, case study, or page you were attempting to access does not exist or has been relocated.
        </p>
    </div>

    <div class="pt-4 flex justify-center gap-3">
        <a href="{% url 'home' %}" class="px-5 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-medium shadow-lg shadow-brand-500/20 transition-all hover-lift">
            Return to Homepage
        </a>
        <a href="{% url 'project_list' %}" class="px-5 py-2.5 rounded-xl bg-dark-800 hover:bg-dark-700 text-gray-300 text-xs font-medium border border-white/10 transition-colors">
            Browse Projects
        </a>
    </div>
</div>
{% endblock %}
